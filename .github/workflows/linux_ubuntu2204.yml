          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            wget \
            curl \
            git \
            libssl-dev \
            pkg-config \
            cmake \
            autoconf \
            libtool \
            tree \
            zip \
            unzip \
            jq \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            ca-certificates \
            software-properties-common \
            gnupg \
            lsb-release \
            libunwind-dev \
            libasound2 \
            libavformat-dev \
            libavfilter-dev \
            libx264-dev \
            nasm \
            yasm \
            uuid-dev \
            libexpat1-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libreadline-dev \
            libmsgpack-dev \
            libcrypto++-dev

          # Clean up apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== Disk space after system dependencies ==="
          df -h

      - name: Check PR status before matrix execution
        uses: actions/github-script@v7
